<!doctype html>
<html lang="en" class="scroll-smooth bg-[#F3F4F6]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/atelion-logo-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#F3F4F6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light" />
    <title>The Pocket Design Playbook — A 180-PAGE DESK REFERENCE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              desk: '#F3F4F6',
              primary: '#1A6CF6',
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Complete Scrollbar Obliteration & Window Locking - 100% Invisible across all browsers and OS */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        width: 100% !important;
        overflow: hidden !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      #root, * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar,
      *::-webkit-scrollbar,
      ::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        max-width: 0px !important;
        max-height: 0px !important;
        display: none !important;
        background: transparent !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track,
      ::-webkit-scrollbar-track-piece,
      *::-webkit-scrollbar-track-piece {
        display: none !important;
        background: transparent !important;
        width: 0px !important;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        display: none !important;
        background: transparent !important;
        width: 0px !important;
        height: 0px !important;
      }
      ::-webkit-scrollbar-button,
      *::-webkit-scrollbar-button {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        background: transparent !important;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
      }
      .no-scrollbar {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
